<form [formGroup]="StklLedegerRepoForm" (ngSubmit)="StkLdgerReport(StklLedegerRepoForm.value)">
    <div class="center">
        <table style="width: 100%;background-color: white;">
            <tr>
                <td class="PageHeader">
                &nbsp;Stock&nbsp;Ledger&nbsp;Reports&nbsp;
                </td>
            </tr>
        </table>
    </div>
    <table class="center">
        <tr>
            <div *ngIf="closeResetButton; then hList1; else hList2"></div>
            <ng-template #hList2>
                <div class="d-flex justify-content-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="sr-only" id="loading"></span>
                    </div>
                </div>
            </ng-template>
            <ng-template #hList1> </ng-template>
            <td class="LabelFontStyle" style="color: blue;width: fit-content;" colspan="4">
                &nbsp;{{dataDisplay}}&nbsp; </td>
        </tr>
    </table>
    <fieldset class="RFS">
        <table class="center">
            <tr>
                <td style="width: 20%" class="LabelFontStyle">
                    &nbsp;From&nbsp;Date&nbsp;:&nbsp;
                </td>
                <td>
                    <input type="date" class="form-control" formControlName="fromDate"  style="background-color: yellow;"
                        max="{{minDate | date:'yyyy-MM-dd'}}">
                </td>
                <td style="width: 20%" class="LabelFontStyle">
                    &nbsp;To&nbsp;Date&nbsp;:&nbsp;
                </td>
                <td>
                    <input type="date" class="form-control" formControlName="toDate"  style="background-color: yellow;"
                        max="{{maxDate | date:'yyyy-MM-dd'}}">
                </td>
                </tr>
                <tr>
                    <td style="width: 15%" class="LabelFontStyle1">&nbsp;Location&nbsp;Name&nbsp;:&nbsp;</td>
                    <td>
                        <select formControlName="locId" id="locId" class="form-control" style="background-color: yellow;">
    
                            <option *ngFor="let sc of RepLocationList" [value]="sc.locId">
                                {{sc.locName}}
                            </option>
                        </select>
                </td>   
                <td style="width: 15%" class="LabelFontStyle">
                    &nbsp;Item&nbsp;Catagary&nbsp;:&nbsp;
                </td>
                    <td>
                    <select formControlName="itemcat" id="itemcat" class="form-control"
                    style="background-color: yellow; width: 14rem;"
                    (change)="onSelectItemType($event)">
                    <option value="--Select--">--Select--</option>
                    <option *ngFor="let sc of  AllreqItemCatagList" [value]="sc.category">
                        {{sc.category}}
                    </option>
                </select>
                </td>
                 <td style="width: 15%" class="LabelFontStyle">
                    &nbsp;Item&nbsp;Name&nbsp;:&nbsp;
                </td>
                    <td>
                        <input type="text"
                        formControlName="itemName"
                        style="background-color: yellow; height: 25px; width: 18rem; font-size: 10px;"
                        id="itemListInput"
                        list="dynamicItemList"
                        class="form-control"
                        placeholder="--Select--" />
                 
                 <datalist id="dynamicItemList">
                   <option *ngFor="let itemN of onSelectItemNameFnList" [value]="itemN.item">
                     {{ itemN.item }}
                   </option>
                 </datalist> 
                 </td>
                
            </tr>
        </table>
    </fieldset>  
    <fieldset class="RFS">
        <table class="center">
            <tr>
                <td>
                    <button class="btn-primary" style="width: 100px; background-color: green;"
                        (click)="reportDetails()">View Reports</button>
                </td>
                <td>
                    <button type="submit" class="btn btn-primary" id="register" (click)="refresh()" style="width:90PX">
                        Clear
                    </button>
                </td>
                <td>
                    <button type="submit" (click)="close()" class="btn btn-primary" style="width:90PX">Close</button>
                </td>
            </tr>
        </table>
    </fieldset> 
</form>
