<form [formGroup]="AdminReqReportForm" (ngSubmit)="adRequReport(AdminReqReportForm.value)">
    <div class="center">
        <table style="width: 100%;background-color: white;">
            <tr>
                <td class="PageHeader">
                    Admin&nbsp;Requision&nbsp;Reports&nbsp;
                </td>
            </tr>
        </table>
    </div>
    <table class="center">
        <tr>
            <div *ngIf="closeResetButton; then hList1; else hList2"></div>
            <ng-template #hList2>
                <div class="d-flex justify-content-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="sr-only" id="loading"></span>
                    </div>
                </div>
            </ng-template>
            <ng-template #hList1> </ng-template>
            <td class="LabelFontStyle" style="color: blue;width: fit-content;" colspan="4">
                &nbsp;{{dataDisplay}}&nbsp; </td>
        </tr>
    </table>
    <fieldset class="RFS">
        <table class="center">
            <tr>
                <div *ngIf="isVisibletoadmin; then thenadmin; else elseadmin"></div>
                <ng-template #thenadmin>
                    <td style="width: 15%; " class="LabelFontStyle">
                        &nbsp;Loaction&nbsp;Name:&nbsp;
                    </td>
                    <td>
                        <select id="locName" class="form-control" formControlName="locName"
                            (change)="onlocationissueselect($event)">
                            <option>--Select--</option>
                            <option *ngFor="let sc of locIdList" [value]="sc.locName">
                                {{sc.locName}}
                            </option>
                        </select>
                    </td>

                    <!-- <td style="width: 15%; " class="LabelFontStyle">
 &nbsp;Department&nbsp;Name:&nbsp;
 </td>
 <td>
 <select id="deptName" class="form-control" formControlName="deptName" (change)="onselectDepartment($event)" >
 <option>--Select--</option>
 <option *ngFor="let sc of DepartmentList" [Value]="sc.cmntypeId" >
 {{sc.codeDesc}}
 </option>
 </select>
 </td> -->
                    <input type="number" hidden formControlName="locationId" class="form-control">
                    <input type="number" hidden formControlName="deptId" class="form-control">
                </ng-template>
                <ng-template #elseadmin>

                </ng-template>



                <td style="width: 15%" class="LabelFontStyle">
                    &nbsp;From&nbsp;Date&nbsp;:&nbsp;
                </td>
                <td>
                    <input type="date" class="form-control" formControlName="fromDate"
                        max="{{minDate | date:'yyyy-MM-dd'}}">
                </td>
                <td style="width: 15%" class="LabelFontStyle">
                    &nbsp;To&nbsp;Date&nbsp;:&nbsp;
                </td>
                <td>
                    <input type="date" class="form-control" formControlName="toDate"
                        max="{{maxDate | date:'yyyy-MM-dd'}}">
                </td>

            </tr>
        </table>
    </fieldset>
    <fieldset class="RFS">
        <table class="center">
            <tr>
                <div *ngIf="isVisibletocmn; then thenad; else elsead"></div>
                <ng-template #thenad>
                <td>
                    <button class="btn-primary" style="width: 100px; background-color: green;"
                        (click)="reportDetailsAdmin()">View Reports</button>
                </td>
                </ng-template>
                <ng-template #elsead>
                    <td>
                        <button class="btn-primary" style="width: 100px; background-color: green;"
                            (click)="reportDetailsuser()">View Reports</button>
                    </td>
                </ng-template>
                
                <td>
                    <button type="submit" class="btn btn-primary" id="register" (click)="refresh()" style="width:90PX">
                        Clear
                    </button>
                </td>
                <td>
                    <button type="submit" (click)="close()" class="btn btn-primary" style="width:90PX">Close</button>
                </td>
            </tr>
        </table>
    </fieldset>




</form>
