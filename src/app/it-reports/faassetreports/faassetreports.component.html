<form [formGroup]="FAReportForm" (ngSubmit)="itfainventory(FAReportForm.value)">
    <table style="width: 100%;background-color: white;" class="center">
        <tr>
            <td class="PageHeader">
                &nbsp;FA&nbsp;BATCH&nbsp;WISE&nbsp;REPORT&nbsp;
            </td>
        </tr>
    </table>
    <fieldset>
        <table class="center">
            <tr>
                <div *ngIf="closeResetButton; then hList1; else hList2"></div>
                <ng-template #hList2>
                    <div class="d-flex justify-content-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="sr-only" id="loading"></span>
                        </div>
                    </div>
                </ng-template>
                <ng-template #hList1> </ng-template>

                <td class="LabelFontStyle" style="color: blue;width: fit-content;" colspan="4">
                    &nbsp;{{dataDisplay}}&nbsp;
                </td>
            </tr>
        </table>
    </fieldset>

    <fieldset class="RFS">
        <legend id="FormsPH_LGAadhaar" class="RFSL" style="font-size: 12px; color: black;font-weight: bold;">FA REPORT BATCH WISE
        </legend>
        <table>
            <tr [style.display]="oufieldvisibleOu ? 'block' : 'none' ">
                <td style="width: 15%" class="LabelFontStyle">
                    &nbsp;Select&nbsp;Ou&nbsp;City:&nbsp;
                </td>
                  <td style="width: fit-content;">
                    <select type='number' formControlName="ouId" id="ouId" class="form-control" (change)="onSelectOuCity($event)" style="background-color: yellow;">
                        <option *ngFor="let sc of  AlllocationitemList" [ngValue]="sc.ouId">
                            {{sc.ouName}}
                        </option>
                    </select>
                </td>
          
                <td style="width: 15%" class="LabelFontStyle">
                    &nbsp;Location&nbsp;Code&nbsp;:&nbsp;
                </td>
                <td>
                    <select formControlName="locId" id="locId" class="form-control">

                        <option *ngFor="let sc of AccRepLocationList" [ngValue]="sc.erpLocId">
                            {{sc.locName}}
                        </option>
                    </select>
                </td>

                <td style="width: 15%" class="LabelFontStyle">Batch&nbsp;Status</td>
                            <td>
                                <select formControlName="bathSts" id="bathSts" class="form-control" (change)="onSelectBatchName($event)" >
                                    <option ngValue="open">OPEN</option>
                                    <option ngValue="Closed">CLOSE</option>
                                </select>
                            </td>
            
            
            <td style="width: 15%" class="LabelFontStyle">
                &nbsp;Batch&nbsp;Name&nbsp;:&nbsp;
            </td>
            <td>
                <select formControlName="batchName" id="batchName" class="form-control">

                    <option *ngFor="let sc of BatchnameList" [value]="sc.batchName">
                        {{sc.batchName}}
                    </option>
                </select>
            </td>
        </tr>


        <!-- ///////////////////////////////////////////////////////////////////////////////////// -->

        <tr [style.display]="oufieldvisible ? 'block' : 'none' ">
            <td>

            </td>
            <td>

            </td>
            <!-- <td style="width: 15%" class="LabelFontStyle">
                &nbsp;Select&nbsp;Ou&nbsp;City:&nbsp;
            </td>
              <td style="width: fit-content;">
                <select type='number' formControlName="ouId" id="ouId" class="form-control"  style="background-color: yellow;">
                    <option *ngFor="let sc of  AlllocationitemList" [ngValue]="sc.ouId">
                        {{sc.ouName}}
                    </option>
                </select>
            </td> -->
      
            <td style="width: 15%" class="LabelFontStyle">
                &nbsp;Location&nbsp;Code&nbsp;:&nbsp;
            </td>
            <td>
                <select formControlName="locId" id="locId" class="form-control">
                    <option *ngFor="let sc of AccRepLocationList" [ngValue]="sc.erpLocId">
                        {{sc.locName}}
                    </option>
                </select>
            </td>

            <td style="width: 15%" class="LabelFontStyle">Batch&nbsp;Status</td>
                        <td>
                            <select formControlName="bathSts" id="bathSts" class="form-control" (change)="onSelectBatchName($event)" >
                                <option ngValue="open">OPEN</option>
                                <option ngValue="Closed">CLOSE</option>
                            </select>
                        </td>
        
        
        <td style="width: 15%" class="LabelFontStyle">
            &nbsp;Batch&nbsp;Name&nbsp;:&nbsp;
        </td>
        <td>
            <select formControlName="batchName" id="batchName" class="form-control">

                <option *ngFor="let sc of BatchnameList" [value]="sc.batchName">
                    {{sc.batchName}}
                </option>
            </select>
        </td>
    </tr>

        </table>
        
     </fieldset>
    <table class="center">
        <table class="center">
            <tr style="width: fit-content;">
                <td >
                    <button class="btn-primary1" style="width: 100px; background-color: green;"
                        (click)="FABatchWiseRepo()">View Report</button>
                </td>
                <td>
                    <button type="submit" class="btn btn-primary" id="register" (click)="refresh()"
                        style="width:90PX">
                        Clear
                    </button>
                </td>
                <td>
                    <button type="submit" (click)="close()" class="btn btn-primary"
                        style="width:90PX">Close</button>
                </td>
            </tr>
        </table>
    </table>

    </form>
